<!-- ======================  _includes/site_header.html  ====================== -->
<header class="site-header">

  <!-- ① Banner (full‑width) ------------------------------------------------ -->
  <div class="banner-wrapper">
    <img
      src="{{ '/assets/img/floodplain_2.jpg' | relative_url }}"
      alt="Banner – {{ site.title }}"
      class="site-banner"
    />
  </div>

  <!-- ② Title / description – sits on top of the banner (you can move it) -->
  <div class="header-content">
    <h1 class="site-title"><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
    <p class="site-description">{{ site.description }}</p>
  </div>

</header>
<!-- =========================================================================== -->
